name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novelforge_test
          POSTGRES_USER: novelforge
          POSTGRES_PASSWORD: novelforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U novelforge -d novelforge_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend deps
        run: |
          python -m pip install -U pip
          pip install -r backend/requirements.txt
          pip install ruff
      - name: Syntax / import smoke
        working-directory: backend
        run: |
          python -m compileall app -q
          python -c "import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('app').rglob('*.py')]"
      - name: Ruff changed backend files
        working-directory: backend
        run: >-
          ruff check
          app/api/routes.py
          app/agents/blank_planner.py
          app/agents/caller.py
          app/contracts/agents.py
          app/prompts.py
          app/services/blank_planning.py
          app/services/library_service.py
          app/startup_checks.py
      - name: Database migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://novelforge:novelforge_test@127.0.0.1:5432/novelforge_test"
          APP_ENV: test
        run: alembic upgrade head
      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://novelforge:novelforge_test@127.0.0.1:5432/novelforge_test"
          PRIMARY_BASE_URL: "http://example.invalid/v1"
          PRIMARY_API_KEY: "ci-placeholder-key"
          APP_ENV: test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        working-directory: deploy
        run: docker compose config >/dev/null
