name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install -U pip
          pip install -r backend/requirements.txt
          pip install pytest ruff
      - name: Syntax / import smoke
        working-directory: backend
        run: |
          python -m compileall app -q
          python -c "import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('app').rglob('*.py')]"
      - name: Ruff (best effort)
        working-directory: backend
        run: ruff check app || true
      - name: Pytest unit
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          PRIMARY_BASE_URL: "http://example.invalid/v1"
          PRIMARY_API_KEY: "replace-with-real-key"
          APP_ENV: test
        run: pytest -q || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        working-directory: deploy
        run: |
          docker compose config >/dev/null || docker-compose config >/dev/null || true
